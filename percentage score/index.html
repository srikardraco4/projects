<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Score Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💖 Percentage Score Calculator 💖</h1>
        <div class="input-group">
            <input type="text" id="name1" placeholder="Enter first name">
            <input type="text" id="name2" placeholder="Enter second name">
        </div>
        <button id="calculateBtn">Calculate Score</button>
        <div class="result-container">
            <p id="resultText"></p>
            <p id="messageText"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
