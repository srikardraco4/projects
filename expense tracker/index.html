<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <button class="btn" id="dark-mode-toggle" style="width:auto;padding:5px 15px;">Dark Mode</button>
            <select id="currency-select" style="width:auto;padding:5px 10px;margin-left:10px;">
                <option value="$">$ USD</option>
                <option value="€">€ EUR</option>
                <option value="£">£ GBP</option>
                <option value="₹">₹ INR</option>
                <option value="¥">¥ JPY</option>
            </select>
            <button class="btn" id="delete-all-btn" style="width:auto;padding:5px 15px;margin-left:10px;background-color:var(--danger-color);">Delete All</button>
        </div>
        <h1>Expense Tracker</h1>

        <div class="balance-container">
            <h2>Current Balance: $<span id="balance">0.00</span></h2>
            <div class="totals">
                <span style="color:var(--primary-color);font-weight:bold;">Income: $<span id="income">0.00</span></span>
                <span style="color:var(--danger-color);font-weight:bold;margin-left:20px;">Expenses: $<span id="expenses">0.00</span></span>
            </div>
        </div>

        <div class="transaction-form">
            <h3>Add New Transaction</h3>
            <form id="transaction-form">
                <div class="form-control">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Enter title..." required>
                </div>
                <div class="form-control">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount" required>
                </div>
                <div class="form-control">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-control">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-control">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="salary">Salary</option>
                        <option value="food">Food</option>
                        <option value="transport">Transport</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="utilities">Utilities</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button class="btn">Add Transaction</button>
            </form>
        </div>

        <div class="filter-controls">
            <h3>Filter Transactions</h3>
            <div class="form-control">
                <label for="filter-category">Filter by Category</label>
                <select id="filter-category">
                    <option value="all">All Categories</option>
                    <option value="salary">Salary</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="utilities">Utilities</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-control">
                <label for="start-date">Start Date</label>
                <input type="date" id="start-date">
            </div>
            <div class="form-control">
                <label for="end-date">End Date</label>
                <input type="date" id="end-date">
            </div>
            <button class="btn" id="apply-filter-btn">Apply Filter</button>
            <button class="btn" id="clear-filter-btn">Clear Filter</button>
        </div>

        <div class="transactions-history">
            <h3>History</h3>
            <ul id="transaction-list" class="list">
                <!-- Transactions will be added here by JavaScript -->
            </ul>
        </div>

        <div class="data-visualization">
            <h3>Spending Trends</h3>
            <canvas id="spending-chart"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
