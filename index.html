<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MangaPin — Read My Manga</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP NAVIGATION -->
  <header>
    <div class="logo" onclick="resetHome()">
      <span>📖</span> MangaPin
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search manga titles, genres..." oninput="renderGrid()" />
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
      <input type="file" id="localUpload" accept="image/*" multiple hidden onchange="handleLocalUpload(event)" />
      <button class="upload-btn" onclick="document.getElementById('localUpload').click()">+ Preview Pages</button>
    </div>
  </header>

  <!-- CATEGORY FILTERS -->
  <div class="filters" id="filterBar">
    <button class="pill active" onclick="setCategory('All', this)">All</button>
    <button class="pill" onclick="setCategory('Action', this)">Action</button>
    <button class="pill" onclick="setCategory('Fantasy', this)">Fantasy</button>
    <button class="pill" onclick="setCategory('Slice of Life', this)">Slice of Life</button>
    <button class="pill" onclick="setCategory('Oneshot', this)">Oneshot</button>
  </div>

  <!-- PINTEREST MASONRY GRID -->
  <main class="masonry" id="mangaGrid"></main>
  <div class="empty-state" id="emptyState">No manga found matching your search.</div>

  <!-- MANGA READER MODAL -->
  <div class="reader-modal" id="readerModal">
    <div class="reader-topbar">
      <div class="reader-title-group">
        <button class="reader-btn" onclick="closeReader()">✕ Back</button>
        <div>
          <div id="readerTitle" class="reader-title">Title</div>
          <div id="readerSub" class="reader-sub">Chapter 1</div>
        </div>
      </div>

      <div class="reader-controls">
        <button class="reader-btn active" id="btnPageMode" onclick="setMode('page')">Page Flip</button>
        <button class="reader-btn" id="btnPanelMode" onclick="setMode('panel')">Panel-by-Panel</button>

        <!-- SUB-OPTION FOR PANEL-BY-PANEL -->
        <div class="sub-mode-group" id="panelSubOptions" style="display:none;">
          <button class="reader-btn sub-btn active" id="btnSubZoom" onclick="setPanelStyle('zoom')">Zoomed</button>
          <button class="reader-btn sub-btn" id="btnSubReveal" onclick="setPanelStyle('reveal')">Reveal on Page</button>
        </div>

        <button class="reader-btn" id="btnVertMode" onclick="setMode('vertical')">Vertical Scroll</button>
        <button class="reader-btn" id="btnRtl" onclick="toggleRTL()" title="Toggle Right-to-Left">RTL: ON</button>
        <button class="reader-btn edit-btn" id="btnEditPanels" onclick="togglePanelEditor()">✏️ Edit Panels</button>
      </div>
</div>>

    <!-- READER VIEWPORT -->
    <div class="reader-viewport page-mode" id="readerViewport"></div>

    <!-- CREATOR PANEL EDITOR OVERLAY -->
    <div class="panel-editor" id="panelEditor" style="display:none;">
      <div class="editor-canvas-area">
        <p class="editor-hint">Click & drag on the page to draw Panel 1, Panel 2, Panel 3...</p>
        <div class="editor-stage" id="editorStage">
          <img id="editorImg" src="" alt="Page to annotate" draggable="false" />
          <div class="editor-boxes" id="editorBoxes"></div>
          <div class="draw-preview" id="drawPreview"></div>
        </div>
      </div>

      <aside class="editor-sidebar">
        <h3>Page <span id="editorPageNum">1</span> Panels</h3>
        <div class="editor-page-nav">
          <button class="reader-btn" onclick="editorChangePage(-1)">← Prev Page</button>
          <button class="reader-btn" onclick="editorChangePage(1)">Next Page →</button>
        </div>

        <div class="panel-list" id="panelList"></div>

        <div class="editor-actions">
          <button class="reader-btn" onclick="clearPagePanels()">🗑 Clear Page</button>
          <button class="reader-btn active" onclick="copyPanelJSON()">📋 Copy Panel Data</button>
          <button class="reader-btn" onclick="togglePanelEditor()">✓ Done & Preview</button>
        </div>
      </aside>
    </div>

    <div class="reader-footer" id="readerFooter">
      <button class="reader-btn" onclick="prevStep()">← Prev</button>
      <span id="pageIndicator">Page 1 / 1</span>
      <button class="reader-btn" onclick="nextStep()">Next →</button>
    </div>
  </div>

  <script src="manga-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
